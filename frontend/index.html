<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 200px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-analyze {
            background: #f56565;
            color: white;
            margin-bottom: 20px;
        }

        .btn-analyze:hover {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.4);
        }

        .control-bar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-count {
            font-size: 1.2em;
            color: #333;
        }

        .task-count strong {
            color: #667eea;
            font-size: 1.5em;
        }

        .results-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .top-tasks {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .top-tasks h2 {
            color: white;
            margin-bottom: 20px;
        }

        .top-task-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .top-task-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
        }

        .task-rank {
            font-size: 3em;
            opacity: 0.5;
            font-weight: bold;
        }

        .task-score-badge {
            background: rgba(255,255,255,0.3);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .task-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .priority-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            color: white;
        }

        .priority-high { background: #f56565; }
        .priority-medium { background: #ed8936; }
        .priority-low { background: #48bb78; }

        .task-details {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            font-size: 0.9em;
            color: #666;
        }

        .task-explanation {
            font-style: italic;
            color: #555;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }

        .score-breakdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.85em;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            color: #999;
            font-size: 0.9em;
        }

        .score-value {
            font-weight: bold;
            color: #667eea;
            font-size: 1.2em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .circular-warning {
            background: #fed7d7;
            color: #c53030;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            display: inline-block;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
            .top-task-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 Smart Task Analyzer</h1>
            <p class="subtitle">Intelligent task prioritization powered by Django</p>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <!-- Single Task Form -->
            <div class="card">
                <h2>➕ Add Single Task</h2>
                <div class="form-group">
                    <label>Task Title *</label>
                    <input type="text" id="title" placeholder="Fix login bug">
                </div>
                <div class="form-group">
                    <label>Due Date *</label>
                    <input type="date" id="dueDate">
                </div>
                <div class="form-group">
                    <label>Estimated Hours *</label>
                    <input type="number" id="hours" step="0.5" placeholder="3">
                </div>
                <div class="form-group">
                    <label>Importance (1-10): <span id="importanceValue">5</span></label>
                    <input type="range" id="importance" min="1" max="10" value="5">
                </div>
                <div class="form-group">
                    <label>Dependencies (comma-separated IDs)</label>
                    <input type="text" id="dependencies" placeholder="task_1, task_2">
                </div>
                <button class="btn-primary" onclick="addTask()">Add Task</button>
            </div>

            <!-- JSON Bulk Input -->
            <div class="card">
                <h2>⚡ Bulk JSON Input</h2>
                <div class="form-group">
                    <label>Paste JSON Array</label>
                    <textarea id="jsonInput" placeholder='[
  {
    "id": "task_1",
    "title": "Fix login bug",
    "due_date": "2025-11-30",
    "estimated_hours": 3,
    "importance": 8,
    "dependencies": []
  }
]'></textarea>
                </div>
                <button class="btn-success" onclick="importJSON()">Import Tasks</button>
            </div>
        </div>

        <!-- Control Bar -->
        <div class="control-bar">
            <div class="task-count">
                Tasks: <strong id="taskCount">0</strong>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="strategy">
                    <option value="smart_balance">Smart Balance</option>
                    <option value="fastest_wins">Fastest Wins</option>
                    <option value="high_impact">High Impact</option>
                    <option value="deadline_driven">Deadline Driven</option>
                </select>
                <button class="btn-analyze" onclick="analyzeTasks()" style="width: auto; padding: 12px 30px;">
                    🔍 Analyze Tasks
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api/tasks';
        let tasks = [];

        // Update importance slider value display
        document.getElementById('importance').addEventListener('input', (e) => {
            document.getElementById('importanceValue').textContent = e.target.value;
        });

        // Add single task
        function addTask() {
            const title = document.getElementById('title').value;
            const dueDate = document.getElementById('dueDate').value;
            const hours = document.getElementById('hours').value;
            const importance = document.getElementById('importance').value;
            const deps = document.getElementById('dependencies').value;

            if (!title || !dueDate || !hours) {
                alert('Please fill in all required fields');
                return;
            }

            const task = {
                id: `task_${Date.now()}`,
                title: title,
                due_date: dueDate,
                estimated_hours: parseFloat(hours),
                importance: parseInt(importance),
                dependencies: deps ? deps.split(',').map(d => d.trim()).filter(d => d) : []
            };

            tasks.push(task);
            updateTaskCount();

            // Clear form
            document.getElementById('title').value = '';
            document.getElementById('dueDate').value = '';
            document.getElementById('hours').value = '';
            document.getElementById('importance').value = 5;
            document.getElementById('importanceValue').textContent = 5;
            document.getElementById('dependencies').value = '';

            alert('Task added successfully!');
        }

        // Import JSON
        function importJSON() {
            const jsonText = document.getElementById('jsonInput').value;
            try {
                const parsed = JSON.parse(jsonText);
                if (!Array.isArray(parsed)) {
                    alert('JSON must be an array');
                    return;
                }

                const newTasks = parsed.map((task, i) => ({
                    ...task,
                    id: task.id || `task_${Date.now()}_${i}`,
                    dependencies: task.dependencies || []
                }));

                tasks.push(...newTasks);
                updateTaskCount();
                document.getElementById('jsonInput').value = '';
                alert(`Imported ${newTasks.length} tasks!`);
            } catch (e) {
                alert('Invalid JSON: ' + e.message);
            }
        }

        // Update task count
        function updateTaskCount() {
            document.getElementById('taskCount').textContent = tasks.length;
        }

        // Analyze tasks
        async function analyzeTasks() {
            if (tasks.length === 0) {
                alert('Please add some tasks first');
                return;
            }

            const strategy = document.getElementById('strategy').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">🔄 Analyzing tasks...</div>';

            try {
                const response = await fetch(`${API_BASE}/analyze/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        tasks: tasks,
                        strategy: strategy
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);

                // Also get suggestions
                await getSuggestions(strategy);
            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = `<div class="card"><p style="color: red;">Error: ${error.message}</p><p>Make sure Django server is running at http://127.0.0.1:8000/</p></div>`;
            }
        }

        // Get top 3 suggestions
        async function getSuggestions(strategy) {
            try {
                const response = await fetch(`${API_BASE}/suggest/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        tasks: tasks,
                        strategy: strategy
                    })
                });

                const data = await response.json();
                displayTopTasks(data.suggestions);
            } catch (error) {
                console.error('Error getting suggestions:', error);
            }
        }

        // Display top 3 tasks
        function displayTopTasks(suggestions) {
            const html = `
                <div class="top-tasks">
                    <h2>🏆 Top 3 Tasks You Should Work On Today</h2>
                    <div class="top-task-grid">
                        ${suggestions.map((task, i) => `
                            <div class="top-task-card">
                                <div class="task-rank">#${i + 1}</div>
                                <div class="task-score-badge">Score: ${task.priority_score}</div>
                                <h3 style="margin: 15px 0; color: white;">${task.title}</h3>
                                <p style="font-size: 0.9em; opacity: 0.9;">${task.explanation}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('results').insertAdjacentHTML('afterbegin', html);
        }

        // Display results
        function displayResults(data) {
            const tasks = data.tasks;
            
            const html = `
                <div class="results-section">
                    <h2>📊 All Tasks (Sorted by Priority)</h2>
                    ${tasks.map((task, i) => {
                        const priority = getPriorityLevel(task.priority_score);
                        return `
                            <div class="task-item">
                                <div class="task-header">
                                    <div>
                                        <span style="color: #999; font-family: monospace; margin-right: 10px;">#${i + 1}</span>
                                        <span class="task-title">${task.title}</span>
                                        <span class="priority-badge priority-${priority.class}">${priority.level}</span>
                                        ${task.has_circular_dependency ? '<span class="circular-warning">⚠️ Circular Dependency</span>' : ''}
                                    </div>
                                    <div style="text-align: right;">
                                        <div style="font-size: 2em; font-weight: bold; color: #667eea;">${task.priority_score}</div>
                                        <div style="font-size: 0.8em; color: #999;">Priority Score</div>
                                    </div>
                                </div>
                                <div class="task-details">
                                    <span>📅 ${task.due_date} ${task.score_breakdown.days_until_due < 0 ? '<strong style="color: red;">(OVERDUE)</strong>' : ''}</span>
                                    <span>⏱️ ${task.estimated_hours}h</span>
                                    <span>⭐ Importance: ${task.importance}/10</span>
                                </div>
                                <div class="task-explanation">
                                    ${generateExplanation(task)}
                                </div>
                                <div class="score-breakdown">
                                    <div class="score-item">
                                        <div class="score-label">Urgency</div>
                                        <div class="score-value">${task.score_breakdown.urgency}</div>
                                    </div>
                                    <div class="score-item">
                                        <div class="score-label">Importance</div>
                                        <div class="score-value">${task.score_breakdown.importance}</div>
                                    </div>
                                    <div class="score-item">
                                        <div class="score-label">Effort</div>
                                        <div class="score-value">${task.score_breakdown.effort}</div>
                                    </div>
                                    <div class="score-item">
                                        <div class="score-label">Dependencies</div>
                                        <div class="score-value">${task.score_breakdown.dependencies}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            
            document.getElementById('results').insertAdjacentHTML('beforeend', html);
        }

        // Get priority level
        function getPriorityLevel(score) {
            if (score >= 7) return { level: 'High', class: 'high' };
            if (score >= 4) return { level: 'Medium', class: 'medium' };
            return { level: 'Low', class: 'low' };
        }

        // Generate explanation
        function generateExplanation(task) {
            const reasons = [];
            const b = task.score_breakdown;

            if (b.days_until_due < 0) {
                reasons.push(`Overdue by ${Math.abs(b.days_until_due)} days`);
            } else if (b.days_until_due === 0) {
                reasons.push('Due today');
            } else if (b.days_until_due <= 3) {
                reasons.push(`Due in ${b.days_until_due} days`);
            }

            if (task.importance >= 8) reasons.push('High importance');
            if (task.estimated_hours <= 2) reasons.push('Quick win');

            const deps = tasks.filter(t => t.dependencies && t.dependencies.includes(task.id)).length;
            if (deps > 0) reasons.push(`Blocks ${deps} task(s)`);

            if (task.has_circular_dependency) reasons.push('⚠️ Circular dependency detected');

            return reasons.length > 0 ? reasons.join(' • ') : 'Standard priority task';
        }

        // Initialize
        updateTaskCount();
    </script>
</body>
</html>
